name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel older in-progress runs of the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run tests with coverage
        env:
          APP_ENV: staging
          SECRET_KEY: ci_key
          DISABLE_EMAILS: "true"
          # Adjust if your code lives under app/ or src/
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/app:${{ github.workspace }}/src
        run: |
          # Run fast: parallel if pytest-xdist is available
          if python -c "import xdist" 2>/dev/null; then
            pytest -n auto --cov=. --cov-report=term-missing
          else
            pytest --cov=. --cov-report=term-missing
          fi

      # Optional: upload HTML coverage (if generated)
      - name: Generate and upload HTML coverage
        if: always()
        run: |
          pytest --cov=. --cov-report=html || true
        continue-on-error: true
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov-${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore
